name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Only read access is needed to run tests.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (node ${{ matrix.node }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The tool is developed on Windows and expected to run in Linux CI, and
        # it shells out to git constantly — so both platforms are tested.
        os: [ubuntu-latest, windows-latest]
        node: [18, 20, 22]

    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        # Version comes from the "packageManager" field in package.json.

      - name: Set up Node ${{ matrix.node }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # The test suite builds real git repositories, so git needs an identity.
      - name: Configure git
        run: |
          git config --global user.name "ci"
          git config --global user.email "ci@example.com"
          git config --global init.defaultBranch main
          git config --global protocol.file.allow always

      - name: Test
        run: pnpm test

  smoke:
    name: smoke (installs as a real package)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Packing and installing the tarball catches a broken "files" list or a
      # bin entry that works from the repo but not from an install.
      - name: Pack and install globally
        run: |
          pnpm pack --pack-destination /tmp
          npm install -g /tmp/*.tgz

      - name: Run the installed binary
        run: |
          poly --version
          poly help
          poly help check
